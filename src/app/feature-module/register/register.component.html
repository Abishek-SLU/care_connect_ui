<app-home-one-header></app-home-one-header>

<div class="content" style="height: 76%">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-8 offset-md-2">
        <div class="account-content">
          <div class="row align-items-center justify-content-center">
            <div class="col-md-7 col-lg-6 login-left">
              <img
                src="assets/img/login-banner.png"
                class="img-fluid"
                alt="Doccure Register"
              />
            </div>

            <div class="col-md-12 col-lg-6 login-right">
              <div class="login-header">
                <h3>
                  {{ headName }}
                  <a
                    (click)="doctorRegister()"
                    style="cursor: pointer; color: blue"
                    >{{ linkName }}</a
                  >
                </h3>
              </div>

              <form [formGroup]="patientRegisterForm">
                <div class="form-floating mb-3">
                  <input
                    type="text"
                    class="form-control"
                    formControlName="name"
                    placeholder="Name"
                    [ngClass]="{ 'is-invalid': validation && f['name'].errors }"
                  />
                  <label>Name</label>
                  <div
                    *ngIf="validation && f['name'].errors"
                    class="invalid-feedback req"
                  >
                    *Required
                  </div>
                </div>

                <div class="form-floating mb-3">
                  <input
                    type="email"
                    class="form-control"
                    formControlName="email"
                    placeholder="Email"
                    [ngClass]="{
                      'is-invalid': validation && f['email'].errors
                    }"
                  />
                  <label>Email</label>
                  <div
                    *ngIf="validation && f['email'].errors"
                    class="invalid-feedback req"
                  >
                    *Valid Email Required
                  </div>
                </div>

                <div class="form-floating mb-3" *ngIf="showChangePassword">
                  <input
                    type="text"
                    class="form-control"
                    formControlName="userName"
                    placeholder="User Name"
                    [ngClass]="{
                      'is-invalid': validation && f['userName'].errors
                    }"
                  />
                  <label>User Name</label>
                  <div
                    *ngIf="validation && f['userName'].errors"
                    class="invalid-feedback req"
                  >
                    *Required
                  </div>
                </div>

                <div
                  class="form-group form-focus mb-3"
                  *ngIf="showChangePassword"
                >
                  <input
                    [type]="showPassword ? 'text' : 'password'"
                    class="form-control floating"
                    formControlName="password"
                    placeholder="Create Password"
                    [ngClass]="{
                      'is-invalid': validation && f['password'].errors
                    }"
                  />
                  <label class="focus-label">Create Password</label>
                  <a class="submit-button" (click)="togglePasswordVisibility()">
                    <i
                      class="fa"
                      [ngClass]="showPassword ? 'fa-eye' : 'fa-eye-slash'"
                    ></i>
                  </a>
                  <div
                    *ngIf="f['password'].hasError('passwordStrength')"
                    class="invalid-feedback req strong"
                  >
                    Must use a strong password (letters, numbers, symbols).
                  </div>
                  <div
                    *ngIf="f['password'].hasError('required')"
                    class="invalid-feedback req"
                  >
                    *Required
                  </div>
                </div>

                <button
                  class="btn btn-primary w-100 btn-lg mt-3"
                  *ngIf="showChangePassword"
                  (click)="userRegisterUpdate()"
                >
                  Signup
                </button>

                <button
                  class="btn btn-primary w-100 btn-lg mt-3"
                  (click)="onSignupClick()"
                  *ngIf="!showChangePassword"
                >
                  Signup
                </button>

                <div class="login-or">
                  <span class="or-line"></span>
                  <span class="span-or">or</span>
                </div>

                <div class="text-center dont-have">
                  Already have an account? <a [routerLink]="'/login'">Login</a>
                </div>
              </form>
            </div>
          </div>
        </div>

        <!-- OTP Popup -->
        <div class="modal fade show d-block" tabindex="-1" *ngIf="showOtpPopup">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3">
              <div class="modal-header">
                <h5 class="modal-title">Enter 4-Digit OTP</h5>
                <button
                  type="button"
                  class="btn-close"
                  (click)="closeOtpPopup()"
                ></button>
              </div>
              <div class="modal-body">
                <input
                  type="text"
                  maxlength="4"
                  class="form-control text-center"
                  [(ngModel)]="otpNumber"
                  placeholder="Enter 4-digit OTP"
                  (input)="onOTPInput($event)"
                />
              </div>
              <div class="modal-footer">
                <button class="btn btn-primary w-100" (click)="verifyOTP()">
                  Verify OTP
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<app-home-one-footer></app-home-one-footer>
