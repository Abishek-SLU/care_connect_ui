<div class="card">
  <div class="text m-3">
    <div class="row">
      <div class="col-sm-6 profile-det-info">
        <h4 class="card-title">Manage Schedule</h4>
      </div>
    </div>
  </div>
  <div class="div scroll">
    <div id="pat_appointments" class="tab-pane fade show active">
      <div class="card-body">
        <div class="filter-widget d-flex" [formGroup]="datefilter">
          <div class="w-30 d-flex">
            <h4 class="mt-3">Date</h4>
            <input
              type="date"
              class="form-control mx-2"
              name="dp"
              [(ngModel)]="dateValue"
              placeholder="Select Date"
              formControlName="date"
            />
          </div>
          <div style="margin-left: 55%">
            <button
              type="submit"
              class="btn bg-primary-light submit-btn"
              (click)="getManageschedule()"
            >
              View Schedule
            </button>
          </div>
        </div>
        <div class="card card-table mt-5">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover table-center mb-0">
                <thead class="tablehead">
                  <tr>
                    <!-- <th>S.no</th> -->
                    <th>Schedule</th>
                    <th class="text-center">Status</th>
                    <th class="text-center">Maximum Patient</th>
                    <th class="text-center">Appointment Confirmed</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody>
                  <tr *ngFor="let data of value; let i = index">
                    <td>
                      {{ convertTo12HourFormat(data.startTime) }}-{{
                        convertTo12HourFormat(data.endTime)
                      }}
                    </td>
                    <!-- <td class="text-center">{{data.status}}</td>   -->
                    <td class="text-center">
                      <span
                        *ngIf="data?.status == 'INACTIVE'"
                        class="badge rounded-pill bg-danger-light"
                        >Inactive</span
                      >
                      <span
                        *ngIf="data?.status == 'ACTIVE'"
                        class="badge rounded-pill bg-success-light"
                        >Active</span
                      >
                    </td>
                    <td class="text-center">{{ data.maxPatients }}</td>
                    <td class="text-center">{{ data.scheduleIdCount }}</td>
                    <td class="text-center">
                      <button
                        *ngIf="data.status == 'INACTIVE'"
                        class="btn btn-sm bg-success-light"
                        (click)="ActiveSchTime(data)"
                      >
                        <i class="fas fa-check mx-1"></i>Active
                      </button>
                      <button
                        *ngIf="data.status == 'ACTIVE'"
                        class="btn btn-sm bg-danger-light"
                        (click)="Reasonmodal(cancel, data)"
                      >
                        <i class="fas fa-times mx-1"></i>Cancel
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #cancel let-modal>
  <div class="modal-header">
    <h4 class="modal-title pull-left">Cancel</h4>
    <button
      type="button"
      class="btn-close"
      aria-label="Close"
      (click)="modal.dismiss('Cross click')"
    ></button>
  </div>
  <form action="" [formGroup]="reasonForm">
    <div class="modal-body">
      <label><h4>Reason</h4></label>
      <textarea
        class="textarea form-control"
        formControlName="reason"
      ></textarea>
      <div class="text-end">
        <button
          type="btn"
          (click)="deleteSchTime(modal)"
          class="btn btn-success text-end mt-2"
        >
          Submit
        </button>
      </div>
    </div>
  </form>
</ng-template>
