<div class="appointments">
  <!-- Appointment List -->
  <div class="appointment-list" *ngFor="let appt of filteredAppointments">
    <div class="profile-info-widget">
      <a class="booking-doc-img">
        <img [src]="appt.patient?.img" alt="User Image" />
      </a>
      <div class="profile-det-info">
        <h3>{{ appt.patient?.name }}</h3>
        <div class="patient-details">
          <h5><i class="far fa-clock"></i> {{ appt.date }}, {{ appt.time }}</h5>
          <h5>
            <i class="fas fa-map-marker-alt"></i> {{ appt.patient?.address }}
          </h5>
          <h5><i class="fas fa-envelope"></i> {{ appt.patient?.email }}</h5>
          <h5 class="mb-0">
            <i class="fas fa-phone"></i> {{ appt.patient?.phone }}
          </h5>
        </div>
      </div>
    </div>
    <div class="appointment-action">
      <a
        href="javascript:void(0)"
        class="btn btn-sm bg-info-light"
        data-bs-toggle="modal"
        data-bs-target="#appt_details"
      >
        <i class="far fa-eye"></i> View
      </a>
      <button class="btn btn-sm bg-success-light" (click)="accept(appt)">
        <i class="fas fa-check"></i> Accept
      </button>
      <button class="btn btn-sm bg-danger-light" (click)="decline(appt)">
        <i class="fas fa-times"></i> Cancel
      </button>
    </div>
  </div>

  <!-- Empty State -->
  <div
    *ngIf="filteredAppointments.length === 0"
    class="text-center text-muted mt-3"
  >
    No active appointments found
  </div>
</div>
