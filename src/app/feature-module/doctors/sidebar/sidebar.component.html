<!-- Profile Sidebar -->
<div class="profile-sidebar side">
  <div class="widget-profile pro-widget-content">
    <div class="profile-info-widget">
      <a>
        <img
          *ngIf="image?.patientData?.data"
          [src]="image?.patientData?.data"
          class="img-fluid rounded-circle"
          alt="Image"
        />
        <img
          *ngIf="!image?.patientData"
          class="img-fluid rounded-circle"
          src="assets/doc image/default-avatar-profile-icon-vector-18942381.jpg"
        />
      </a>
      <!-- <a>
				<img *ngIf="image" class="img-fluid"
					src="assets/doc image/default-avatar-profile-icon-vector-18942381.jpg">
				<img *ngIf="image" [src]="image.patientData?.data"
					class="img-fluid rounded-circle" alt="Doctor Image">
			</a> -->
      <div class="profile-det-info mt-2">
        <h3>{{ values?.doctorName }}</h3>
        <div class="patient-details text-muted">
          <p
            class="mb-0"
            *ngIf="
              values?.education &&
              values?.education.length &&
              values?.education[0] !== ''
            "
          >
            <i class="fas fa-user-graduate"></i>
            &nbsp;{{ values?.education }}
          </p>

          <p
            *ngIf="
              values?.specializationName &&
              values?.specializationName.length &&
              values?.specializationName[0] !== ''
            "
          >
            <i class="fas fa-stethoscope"></i> &nbsp;{{
              values?.specializationName
            }}
          </p>
        </div>
      </div>
    </div>
  </div>

  <div class="dashboard-widget">
    <nav class="dashboard-menu">
      <ul>
        <li [class.active]="name === 'Dashboard' || page === 'dashboard'">
          <a
            [routerLink]="'dashboard'"
            (click)="navigate('Dashboard')"
            routerLinkActive="active"
          >
            <i class="fas fa-columns"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li [class.active]="name === 'Appointments' || page === 'appointment'">
          <a
            [routerLink]="'appointments'"
            (click)="navigate('Appointments')"
            routerLinkActive="active"
          >
            <i class="fas fa-calendar-check"></i>
            <span>Appointments</span>
          </a>
        </li>
        <li [class.active]="name === 'My Patients' || page === 'patientslist'">
          <a
            [routerLink]="'patients-list'"
            (click)="navigate('My Patients')"
            routerLinkActive="active"
          >
            <i class="fas fa-user-injured"></i>
            <span>My Patients</span>
          </a>
        </li>
        <li
          [class.active]="
            name === 'Schedule Timings' || page === 'scheduletiming'
          "
          (click)="navigate('Schedule Timings')"
        >
          <a [routerLink]="'schedule-timing'" routerLinkActive="active">
            <i class="fas fa-hourglass-start"></i>
            <span>Schedule Timings</span>
          </a>
        </li>
        <li
          [class.active]="
            name === 'Manage Schedule' || page === 'manageschedule'
          "
          (click)="navigate('Manage Schedule')"
        >
          <a [routerLink]="'manage-schedule'" routerLinkActive="active">
            <i class="fas fa-clipboard-list"></i>
            <span>Manage Schedule</span>
          </a>
        </li>
        <!-- <li [class.active]="name === 'Invoices' || page === 'invoice'">
          <a
            [routerLink]="'invoice'"
            routerLinkActive="active"
            (click)="navigate('Invoices')"
          >
            <i class="fas fa-file-invoice"></i>
            <span>Invoices</span>
          </a>
        </li> -->
        <li [class.active]="name === 'Accounts' || page === 'accounts'">
          <a
            [routerLink]="'accounts'"
            routerLinkActive="active"
            (click)="navigate('Accounts')"
          >
            <i class="fas fa-file-invoice-dollar"></i>
            <span>Accounts</span>
          </a>
        </li>
        <!-- <li  [class.active]="name === 'Reviews'  || page === 'reviews'" (click)="navigate('Reviews')">
                        <a   [routerLink]="'reviews'">
                            <i class="fas fa-star"></i>
                            <span>Reviews</span>
                        </a>
                    </li> -->
        <!-- <li  [class.active]="name === 'Message' || page === 'message'" (click)="navigate('Message')">
                        <a   [routerLink]="'message'">
                            <i class="fas fa-comments"></i>
                            <span>Message</span>
                            <small class="unread-msg">23</small>
                        </a>
                    </li> -->
        <li
          [class.active]="
            name === 'Profile Setting' || page === 'profilesetting'
          "
        >
          <a
            [routerLink]="'profile-settings'"
            (click)="navigate('Profile Setting')"
            routerLinkActive="active"
          >
            <i class="fas fa-user-cog"></i>
            <span>Profile Settings</span>
          </a>
        </li>
        <!-- <li [class.active]="name === 'Social Media'" (click)="navigate('Social Media')">
                        <a [routerLink]="'social-media'">
                            <i class="fas fa-share-alt"></i>
                            <span>Social Media</span>
                        </a>
                    </li> -->
        <li [class.active]="name === 'Change Password'">
          <a
            [routerLink]="'changepassword'"
            (click)="navigate('Change Password')"
            routerLinkActive="active"
          >
            <i class="fas fa-lock"></i>
            <span>Change Password</span>
          </a>
        </li>
        <li [class.active]="name === 'Master'">
          <a
            (click)="navigate('Master')"
            [routerLink]="'/common/country'"
            routerLinkActive="active"
          >
            <i class="fas fa-comments"></i>
            <span>Master</span>
          </a>
        </li>
        <li>
          <a
            (click)="logout(modal)"
            style="cursor: pointer"
            routerLinkActive="active"
          >
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</div>
<ng-template #modal let-modal>
  <div class="modal-header">
    <h4 class="modal-title pull-left">Logout</h4>
    <button
      type="button"
      class="btn-close"
      aria-label="Close"
      (click)="modal.dismiss('Cross click')"
    ></button>
  </div>
  <div class="modal-body">
    Are you sure to Logout?
    <div style="margin-top: 25px" class="text-end">
      <button
        type="button"
        class="btn btn-success btn-sm mx-2"
        id="btn-yes"
        (click)="clear()"
      >
        Yes
      </button>
      <button
        type="button"
        class="btn btn-danger btn-sm mx-2"
        id="btn-no"
        (click)="modal.dismiss()"
      >
        No
      </button>
    </div>
  </div>
</ng-template>
