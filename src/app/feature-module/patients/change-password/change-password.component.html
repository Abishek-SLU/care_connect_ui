<div class="card">
  <div class="card-body">
    <div class="row">
      <div class="col-md-12 col-lg-6">
        <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label>Old Password</label>
            <input
              type="password"
              class="form-control"
              formControlName="oldPassword"
              [ngClass]="{
                'is-invalid':
                  (validation && f['oldPassword'].errors) ||
                  (f['oldPassword'].invalid &&
                    (f['oldPassword'].dirty || f['oldPassword'].touched))
              }"
            />
            <div
              *ngIf="
                (validation && f['oldPassword'].errors) ||
                (f['oldPassword'].invalid &&
                  (f['oldPassword'].dirty || f['oldPassword'].touched))
              "
              class="invalid-feedback"
            >
              Old password is required
            </div>
          </div>

          <div class="form-group">
            <label>New Password</label>
            <input
              type="password"
              class="form-control"
              formControlName="newPassword"
              [ngClass]="{
                'is-invalid':
                  (validation && f['newPassword'].errors) ||
                  (f['newPassword'].invalid &&
                    (f['newPassword'].dirty || f['newPassword'].touched))
              }"
            />
            <div
              *ngIf="
                (validation && f['newPassword'].errors) ||
                (f['newPassword'].invalid &&
                  (f['newPassword'].dirty || f['newPassword'].touched))
              "
              class="invalid-feedback"
            >
              New password is required
            </div>
          </div>

          <div class="form-group">
            <label>Confirm Password</label>
            <input
              type="password"
              class="form-control"
              formControlName="confirmPassword"
              [ngClass]="{
                'is-invalid':
                  (validation && f['confirmPassword'].errors) ||
                  (f['confirmPassword'].invalid &&
                    (f['confirmPassword'].dirty || f['confirmPassword'].touched))
                  || passwordMismatch
              }"
            />
            <div
              *ngIf="
                (validation && f['confirmPassword'].errors) ||
                (f['confirmPassword'].invalid &&
                  (f['confirmPassword'].dirty || f['confirmPassword'].touched))
              "
              class="invalid-feedback"
            >
              Confirm password is required
            </div>
            <div *ngIf="passwordMismatch" class="invalid-feedback d-block">
              New password and confirm password must match
            </div>
          </div>

          <div class="submit-section">
            <button
              type="submit"
              class="btn btn-primary submit-btn"
              [disabled]="loading"
            >
              {{ loading ? 'Saving...' : 'Save Changes' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
