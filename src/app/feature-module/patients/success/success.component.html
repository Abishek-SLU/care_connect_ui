<div class="content success-page-cont">
  <div class="container-fluid">
    <div *ngIf="loading" class="d-flex justify-content-center py-5">
      <div
        class="spinner-border text-primary"
        style="width: 3rem; height: 3rem"
      ></div>
    </div>

    <div *ngIf="!loading" class="row justify-content-center">
      <div class="col-lg-6">
        <div class="card success-card">
          <div class="card-body">
            <div class="success-cont">
              <i class="fas fa-check"></i>
              <h3>Appointment booked Successfully!</h3>

              <p *ngIf="doctorName && dateLabel && timeLabel">
                Appointment booked with <strong>{{ doctorName }}</strong
                ><br />
                on <strong>{{ dateLabel }} {{ timeLabel }}</strong>
              </p>

              <p *ngIf="!(doctorName && dateLabel && timeLabel)">
                Appointment booked successfully, but details could not be
                loaded.
              </p>

              <button
                class="btn btn-primary view-inv-btn"
                (click)="viewInvoice()"
              >
                View Invoice
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
