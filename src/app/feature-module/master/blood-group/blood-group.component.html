<div>
    <ngx-spinner bdColor="rgba(51,51,51,0.8)" size="medium" color="#fff" type="ball-scale-multiple">
        <p style="font-size: 20px; color: rgb(249, 244, 244)">Loading...</p>
    </ngx-spinner>
</div>

<div class="card">
    <div class="text m-3">
        <div class="row">
            <div class="col-sm-6 profile-det-info">
                <h3 class="card-title ">BloodGroup</h3>
            </div>
            <div class="col-sm-6">
                <div class="text-end">
                    <a (click)="newBloodGroup(content)" data-bs-toggle="modal" class="btn btn-primary btn-sm"
                        tabindex="0">+ Create</a>
                </div>
            </div>
        </div>
    </div>
    <div class="div scroll">
        <div class="card-body">
            <div class=" card card-table mb-0">
                <div class="card-body">
                    <div class="table-responsive scroll">
                        <table class="table table-center bg-white mb-0">
                            <thead class="tablehead">
                                <tr>
                                    <th>S.no</th>
                                    <th class="text-center">Name</th>
                                    <!-- <th class="text-center">Status</th> -->
                                    <th class="text-center"></th>
                                </tr>

                            </thead>
                            <tbody>
                                <tr *ngFor="let Arr of jobsArr;
                                    let i=index">
                                    <td>{{i+1}} </td>

                                    <td class="border-bottom p-2 data text-center">{{Arr.name |uppercase}}</td>
                                    <!-- <td class="border-bottom p-2 data text-center">{{Arr.status |uppercase}}</td> -->
                                    <td class="border-bottom p-1 text-center">

                                        <div class="table-action">
                                            <a class="btn  bg-info-light" data-bs-toggle="modal"
                                                (click)="onEdit(content,Arr.id)"> <i class="fas fa-edit"></i></a>
                                            <a class="btn bg-danger-light trash"
                                                (click)="deleteModal(delete, Arr.id)"><i
                                                    class="far fa-trash-alt"></i></a>
                                        </div>

                                    </td>
                                </tr>
                                <tr class="data" *ngIf="!jobsArr?.length">
                                    <td colspan="7" class="text-center"><i class="fa fa-search mt-5"
                                            style='font-size:36px; opacity: 70%;'></i>
                                        <p class="mt-2">No Data Found</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #content let-modal class="modals">
    <div class="modal-header ">
        <h6 *ngIf="!bloodGroupform.value.id" class="modal-title">Create BloodGroup</h6>
        <h6 *ngIf="bloodGroupform.value.id" class="modal-title">Update BloodGroup</h6>
        <button type="button" class="btn outline-none" aria-label="Close"
            (click)="modal.dismiss('Cross click')">X</button>
    </div>
    <div class="modal-body">
        <form [formGroup]="bloodGroupform">
            <div class="mt-3">
                <label for="CountryName">Name<span class="text-danger">*</span></label>
                <input type="text" class="form-control" formControlName="name" placeholder="BloodGroup Name"
                    [ngClass]="{ 'is-invalid': submitted && b['name'].errors || b['name'].invalid && (b['name'].dirty || b['name'].touched)}">
                <div *ngIf="submitted && b['name'].errors || b['name'].invalid && (b['name'].dirty || b['name'].touched)"
                    class="invalid-feedback">
                    Required
                </div>
            </div>
            <!-- <div class="mt-3">
                <label for="CountryName">Status<span class="text-danger">*</span></label>
                <select class="form-control" formControlName="status"
                    [ngClass]="{'is-invalid': submitted && b['status'].errors || b['status'].invalid && (b['status'].dirty || b['status'].touched)}">
                    <option value="" disabled selected>Select Status</option>
                    <option>ACTIVE</option>
                    <option>INACTIVE</option>
                </select>
                <div *ngIf="submitted && (b['status'].errors || b['status'].invalid) && (b['status'].dirty || b['status'].touched)"
                    class="invalid-feedback">
                    Required
                </div>
            </div> -->
        </form>
    </div>
    <div class="modal-footer">
        <button *ngIf="!bloodGroupform.value.id" type="button" class="btn btn-sm btn-primary mr-2"
            (click)="onSubmit(modal)"><b>Submit</b></button>
        <button *ngIf="bloodGroupform.value.id" type="button" class="btn btn-sm btn-primary mr-2"
            (click)="onUpdate(modal)"><b>Update</b></button>
    </div>
</ng-template>
<ng-template #delete let-modal>
    <div class="modal-header">
        <h6 class="modal-title">Delete BloodGroup </h6>
        <button type="button" class="btn outline-none" aria-label="Close"
            (click)="modal.dismiss('Cross click')">X</button>
    </div>
    <div class="modal-body">
        <p> Are you sure want to delete ?</p>
    </div>
    <div class="modal-footer">
        <button class="btn btn-sm btn-danger" (click)="modal.dismiss('cancel click')">Cancel</button>
        <button class="btn btn-sm btn-primary" (click)="onDelete(modal)">Ok</button>
    </div>
</ng-template>
