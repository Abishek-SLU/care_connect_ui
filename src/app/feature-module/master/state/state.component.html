<div>
    <ngx-spinner bdColor="rgba(51,51,51,0.8)" size="medium" color="#fff" type="ball-scale-multiple">
        <p style="font-size: 20px; color: rgb(249, 244, 244)">Loading...</p>
    </ngx-spinner>
</div>

<div class="card">
    <div class="text m-3">
        <div class="row">
            <div class="col-sm-6 profile-det-info">
                <h3 class="card-title ">State</h3>
            </div>
            <div class="col-sm-6">
                <div class="text-end">
                    <a (click)="newState(content)" data-bs-toggle="modal" class="btn btn-primary btn-sm" tabindex="0">+
                        Create</a>
                </div>
            </div>
        </div>
    </div>
    <div class="div scroll">
        <div class="card-body">

            <div class=" card card-table mb-0">
                <div class="card-body">
                    <div class="table-responsive ">
                        <table class="table table-center bg-white mb-0">
                            <thead class="tablehead">
                                <tr>
                                    <th>S.no</th>
                                    <th class="border-bottom p-2">Name</th>
                                    <th class="border-bottom p-2">Short Name</th>
                                    <th class="border-bottom p-2">Country</th>
                                    <th class="border-bottom p-2 "></th>
                                </tr>

                            </thead>
                            <tbody>
                                <tr *ngFor="let Arr of stateArr; let i=index">
                                    <td>{{i+1}}</td>
                                    <td class="border-bottom p-1 ">{{Arr.stateName |uppercase }}</td>
                                    <td class="border-bottom p-1 ">{{Arr.shortName |uppercase }}</td>
                                    <td class="border-bottom p-1 ">{{Arr.countryName |uppercase }}</td>
                                    <td class="border-bottom p-1 ">

                                        <div class="table-action">
                                            <a class="btn bg-info-light" data-bs-toggle="modal"
                                                (click)="onEdit(content,Arr.id)"> <i class="fas fa-edit"></i></a>
                                            <a class="btn bg-danger-light trash"
                                                (click)="deleteModal(delete, Arr.id)"><i
                                                    class="far fa-trash-alt"></i></a>
                                        </div>
                                    </td>
                                </tr>
                                <tr class="data" *ngIf="!stateArr?.length">
                                    <td colspan="7" class="text-center"><i class="fa fa-search mt-5"
                                            style='font-size:36px; opacity: 70%;'></i>
                                        <p class="mt-2">No Data Found</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #content let-modal>
    <div class="modal-content">

        <div class="modal-header">
            <h6 *ngIf="!stateForm.value.id" class="modal-title">Create State</h6>
            <h6 *ngIf="stateForm.value.id" class="modal-title">Update State</h6>
            <button type="button" class="btn outline-none" aria-label="Close"
                (click)="modal.dismiss('Cross click')">X</button>
        </div>
        <div class="modal-body">
            <form [formGroup]="stateForm">
                <div class="mt-3">
                    <label for="countryId">Country<span class="text-danger">*</span></label>
                    <select id="countryId" class="form-control drop" formControlName="countryId">
                        <option [ngValue]="null" >Select Country</option>
                        <option *ngFor="let country of jobsArr" [value]="country.id">{{ country.countryName }}</option>
                    </select>
                    <div *ngIf="submitted && (b['countryId'].errors || b['countryId'].invalid)"
                        class="invalid-feedback">
                        Required
                    </div>
                </div>

                <div class="mt-3">
                    <label for="StateName">Name<span class="text-danger">*</span></label>
                    <input type="text" class="form-control" formControlName="stateName" placeholder="State Name"
                        [ngClass]="{ 'is-invalid': submitted && b['stateName'].errors || b['stateName'].invalid && (b['stateName'].dirty || b['stateName'].touched)}">
                    <div *ngIf="submitted && b['stateName'].errors || b['stateName'].invalid && (b['stateName'].dirty || b['stateName'].touched)"
                        class="invalid-feedback">
                        Required
                    </div>
                </div>
                <div class="mt-3">
                    <label for="StateShortName">Short Name<span class="text-danger">*</span></label>
                    <input type="text" class="form-control" formControlName="shortName" placeholder=" Short Name"
                        [ngClass]="{ 'is-invalid': submitted && b['shortName'].errors || b['shortName'].invalid && (b['shortName'].dirty || b['shortName'].touched)}">
                    <div *ngIf="submitted && b['shortName'].errors || b['shortName'].invalid && (b['shortName'].dirty || b['shortName'].touched)"
                        class="invalid-feedback">
                        Required
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button *ngIf="!stateForm.value.id" type="button" class="btn btn-sm btn-primary mr-2"
                (click)="onSubmit(modal)"><b>Submit</b></button>
            <button *ngIf="stateForm.value.id" type="button" class="btn btn-sm btn-primary mr-2"
                (click)="onUpdate(modal)"><b>Update</b></button>
        </div>
    </div>
</ng-template>
<ng-template #delete let-modal>
    <div class="modal-content ">
        <div class="modal-header">
            <h6 class="modal-title">Delete State</h6>
            <button class="btn outline-none" aria-label="Close" (click)="modal.dismiss('Cross click')">X</button>
        </div>
        <div class="modal-body">
            <p> Are you sure you want to delete ? </p>
        </div>
        <div class="modal-footer"> <button class="btn btn-sm btn-danger"
                (click)="modal.dismiss('cancel click')">Cancel</button> <button class="btn btn-sm btn-primary"
                (click)="onDelete(modal)">Ok</button>
        </div>
    </div>
</ng-template>
