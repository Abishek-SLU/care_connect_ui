<div>
  <ngx-spinner
    bdColor="rgba(51,51,51,0.8)"
    size="medium"
    color="#fff"
    type="ball-scale-multiple"
  >
    <p style="font-size: 20px; color: rgb(249, 244, 244)">Loading...</p>
  </ngx-spinner>
</div>

<div class="card">
  <div class="text m-3">
    <div class="row">
      <div class="col-sm-6 profile-det-info">
        <h3 class="card-title">City</h3>
      </div>
      <div class="col-sm-6">
        <div class="text-end">
          <a
            (click)="newDistrict(content)"
            data-bs-toggle="modal"
            class="btn btn-primary btn-sm"
            tabindex="0"
            >+ Create</a
          >
        </div>
      </div>
    </div>
  </div>
  <div class="div scroll">
    <div class="card-body">
      <div class="card card-table mb-0">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-center bg-white mb-0">
              <thead class="tablehead">
                <tr>
                  <th>S.no</th>
                  <th class="border-bottom p-1">Name</th>
                  <th class="border-bottom p-1">Short Name</th>
                  <th class="border-bottom p-1"></th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let Arr of distArr; let i = index">
                  <td>{{ i + 1 }}</td>
                  <td class="border-bottom p-1">
                    {{ Arr.districtName | uppercase }}
                  </td>
                  <td class="border-bottom p-1">
                    {{ Arr.shortName | uppercase }}
                  </td>
                  <td class="border-bottom p-1">
                    <div class="table-action">
                      <a
                        class="btn bg-info-light"
                        (click)="onEdit(content, Arr.id)"
                      >
                        <i class="fas fa-edit"></i>
                      </a>
                      <a
                        class="btn bg-danger-light trash"
                        (click)="deleteModal(delete, Arr.id)"
                      >
                        <i class="far fa-trash-alt"></i>
                      </a>
                    </div>
                  </td>
                </tr>
                <tr class="data" *ngIf="!distArr?.length">
                  <td colspan="7" class="text-center">
                    <i
                      class="fa fa-search mt-5"
                      style="font-size: 36px; opacity: 70%"
                    ></i>
                    <p class="mt-2">No Data Found</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #content let-modal>
  <div class="modal-header">
    <h6 *ngIf="!districtForm.value.id" class="modal-title">Create City</h6>
    <h6 *ngIf="districtForm.value.id" class="modal-title">Update City</h6>
    <button
      type="button"
      class="btn outline-none"
      aria-label="Close"
      (click)="modal.dismiss('Cross click')"
    >
      X
    </button>
  </div>
  <div class="modal-body">
    <form [formGroup]="districtForm">
      <div class="mt-3">
        <label for="countryId">Country<span class="text-danger">*</span></label>
        <select
          id="countryId"
          (change)="stateGet($event)"
          class="form-control"
          formControlName="countryId"
          [ngClass]="{ 'is-invalid': submitted && b['countryId'].invalid }"
        >
          <option [ngValue]="null">Select Country</option>
          <option *ngFor="let country of jobsArr" [value]="country.id">
            {{ country.countryName }}
          </option>
        </select>
        <div
          *ngIf="submitted && b['countryId'].invalid"
          class="invalid-feedback"
        >
          Required
        </div>
      </div>

      <div class="mt-3">
        <label for="stateId">State<span class="text-danger">*</span></label>
        <select
          id="stateId"
          class="form-control"
          formControlName="stateId"
          [ngClass]="{ 'is-invalid': submitted && b['stateId'].invalid }"
        >
          <option [ngValue]="null">Select State</option>
          <option *ngFor="let state of stateArr" [value]="state.id">
            {{ state.stateName }}
          </option>
        </select>
        <div *ngIf="submitted && b['stateId'].invalid" class="invalid-feedback">
          Required
        </div>
      </div>

      <div class="mt-3">
        <label for="DistrictName">Name<span class="text-danger">*</span></label>
        <input
          type="text"
          class="form-control"
          formControlName="districtName"
          placeholder="City Name"
          [ngClass]="{ 'is-invalid': submitted && b['districtName'].invalid }"
        />
        <div
          *ngIf="submitted && b['districtName'].invalid"
          class="invalid-feedback"
        >
          Required
        </div>
      </div>
      <div class="mt-3">
        <label for="ShortName"
          >Short Name<span class="text-danger">*</span></label
        >
        <input
          type="text"
          class="form-control"
          formControlName="shortName"
          placeholder="Short Name"
          [ngClass]="{ 'is-invalid': submitted && b['shortName'].invalid }"
        />
        <div
          *ngIf="submitted && b['shortName'].invalid"
          class="invalid-feedback"
        >
          Required
        </div>
      </div>
    </form>
  </div>
  <div class="modal-footer">
    <button
      *ngIf="!districtForm.value.id"
      type="button"
      class="btn btn-sm btn-primary mr-2"
      (click)="onSubmit(modal)"
    >
      <b>Submit</b>
    </button>
    <button
      *ngIf="districtForm.value.id"
      type="button"
      class="btn btn-sm btn-primary mr-2"
      (click)="onUpdate(modal)"
    >
      <b>Update</b>
    </button>
  </div>
</ng-template>

<ng-template #delete let-modal>
  <div class="modal-header">
    <h6 class="modal-title">Delete City</h6>
    <button
      type="button"
      class="btn outline-none"
      aria-label="Close"
      (click)="modal.dismiss('Cross click')"
    >
      X
    </button>
  </div>
  <div class="modal-body">
    <p>Are you sure you want to delete ?</p>
  </div>
  <div class="modal-footer">
    <button
      class="btn btn-sm btn-danger"
      (click)="modal.dismiss('cancel click')"
    >
      Cancel
    </button>
    <button class="btn btn-sm btn-primary" (click)="onDelete(modal)">Ok</button>
  </div>
</ng-template>
