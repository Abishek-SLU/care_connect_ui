<div>
  <ngx-spinner
    bdColor="rgba(51,51,51,0.8)"
    size="medium"
    color="#fff"
    type="ball-scale-multiple"
  >
    <p style="font-size: 20px; color: rgb(249, 244, 244)">Loading...</p>
  </ngx-spinner>
</div>

<div class="card">
  <div class="text m-3">
    <div class="row">
      <div class="col-sm-6 profile-det-info">
        <h3 class="card-title">Country</h3>
      </div>
      <div class="col-sm-6">
        <div class="text-end">
          <a
            (click)="newcountry(content)"
            class="btn btn-primary btn-sm"
            tabindex="0"
            >+ Create</a
          >
        </div>
      </div>
    </div>
  </div>

  <div class="div scroll">
    <div class="card-body">
      <div class="card card-table mb-0">
        <div class="table-responsive">
          <table class="table table-hover table-center mb-0">
            <thead class="tablehead">
              <tr>
                <th>S.no</th>
                <th>Name</th>
                <th>Short Name</th>
                <th>Phone Code</th>
                <th></th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let Arr of jobsArr; let i = index">
                <td>{{ i + 1 }}</td>
                <td>{{ Arr.countryName | uppercase }}</td>
                <td>{{ Arr.shortName | uppercase }}</td>
                <td>+{{ Arr.countryCode }}</td>
                <td>
                  <div class="table-action">
                    <a
                      class="btn bg-info-light"
                      (click)="onEdit(content, Arr.id)"
                    >
                      <i class="fas fa-edit"></i>
                    </a>

                    <a
                      class="btn bg-danger-light trash"
                      (click)="deleteModal(delete, Arr.id)"
                    >
                      <i class="far fa-trash-alt"></i>
                    </a>
                  </div>
                </td>
              </tr>

              <tr *ngIf="!jobsArr?.length">
                <td colspan="5" class="text-center">
                  <i
                    class="fa fa-search mt-5"
                    style="font-size: 36px; opacity: 70%"
                  ></i>
                  <p class="mt-2">No Data Found</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<ng-template #content let-modal>
  <div class="modal-header">
    <h6 *ngIf="!countryForm.value.id">Create Country</h6>
    <h6 *ngIf="countryForm.value.id">Update Country</h6>
    <button
      type="button"
      class="btn outline-none"
      (click)="modal.dismiss('close')"
    >
      X
    </button>
  </div>

  <div class="modal-body">
    <form [formGroup]="countryForm">
      <div class="mt-3">
        <label>Name<span class="text-danger">*</span></label>
        <input
          type="text"
          class="form-control"
          formControlName="countryName"
          [ngClass]="{ 'is-invalid': submitted && b['countryName'].invalid }"
        />
        <div *ngIf="submitted && b['countryName'].invalid" class="invalid-feedback">
          Required
        </div>
      </div>

      <div class="mt-3">
        <label>Short Name<span class="text-danger">*</span></label>
        <input
          type="text"
          class="form-control"
          formControlName="shortName"
          [ngClass]="{ 'is-invalid': submitted && b['shortName'].invalid }"
        />
        <div *ngIf="submitted && b['shortName'].invalid" class="invalid-feedback">
          Required
        </div>
      </div>

      <div class="mt-3">
        <label>Phone Code<span class="text-danger">*</span></label>
        <input
          type="number"
          class="form-control"
          formControlName="countryCode"
          [ngClass]="{ 'is-invalid': submitted && b['countryCode'].invalid }"
        />
        <div *ngIf="submitted && b['countryCode'].invalid" class="invalid-feedback">
          Required
        </div>
      </div>
    </form>
  </div>

  <div class="modal-footer">
    <button
      *ngIf="!countryForm.value.id"
      class="btn btn-sm btn-primary"
      (click)="onSubmit(modal)"
    >
      Submit
    </button>

    <button
      *ngIf="countryForm.value.id"
      class="btn btn-sm btn-primary"
      (click)="onUpdate(modal)"
    >
      Update
    </button>
  </div>
</ng-template>

<ng-template #delete let-modal>
  <div class="modal-header">
    <h6>Delete Country</h6>
    <button type="button" class="btn outline-none" (click)="modal.dismiss('close')">X</button>
  </div>

  <div class="modal-body">
    <p>Are you sure want to delete?</p>
  </div>

  <div class="modal-footer">
    <button class="btn btn-sm btn-danger" (click)="modal.dismiss('close')">
      Cancel
    </button>
    <button class="btn btn-sm btn-primary" (click)="onDelete(modal)">
      OK
    </button>
  </div>
</ng-template>
