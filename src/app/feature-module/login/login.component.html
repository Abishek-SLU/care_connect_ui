<app-home-one-header></app-home-one-header>

<ngx-spinner
  bdColor="rgba(51,51,51,0.8)"
  size="medium"
  color="#fff"
  type="ball-scale-multiple"
>
  <p style="font-size: 20px; color: rgb(249, 244, 244)">Loading...</p>
</ngx-spinner>

<div class="content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-8 offset-md-2">
        <div class="account-content">
          <div class="row align-items-center justify-content-center">
            <div class="col-md-7 col-lg-6 login-left">
              <img
                src="assets/img/login-banner.png"
                class="img-fluid"
                alt="Care Connect Login"
              />
            </div>
            <div class="col-md-12 col-lg-6 login-right">
              <div class="login-header">
                <h3>Login <span>Care Connect</span></h3>
              </div>
              <form [formGroup]="Login">
                <div class="form-group form-focus">
                  <label class="focus-label">Username</label>
                  <input
                    type="text"
                    name="userName"
                    id="userName"
                    class="form-control floating"
                    formControlName="userName"
                    [ngClass]="{
                      'is-invalid':
                        (submitted && f['userName'].errors) ||
                        (f['userName'].invalid &&
                          (f['userName'].dirty || f['userName'].touched))
                    }"
                    maxlength="10"
                    (input)="onInput($event)"
                  />
                  <div
                    *ngIf="
                      (submitted && f['userName'].errors) ||
                      (f['userName'].invalid &&
                        (f['userName'].dirty || f['userName'].touched))
                    "
                    class="invalid-feedback"
                  >
                    *Requried
                  </div>
                </div>
                <div class="form-group form-focus">
                  <label class="focus-label">Password</label>
                  <input
                    name="password"
                    id="password"
                    [type]="showPassword ? 'text' : 'password'"
                    class="form-control floating mt-1"
                    formControlName="password"
                    [ngClass]="{
                      'is-invalid':
                        (submitted && f['password'].errors) ||
                        (f['password'].invalid &&
                          (f['password'].dirty || f['password'].touched))
                    }"
                  />
                  <div
                    *ngIf="
                      (submitted && f['password'].errors) ||
                      (f['password'].invalid &&
                        (f['password'].dirty || f['password'].touched))
                    "
                    class="invalid-feedback"
                  >
                    *Required
                  </div>
                </div>

                <div class="text-end">
                  <a class="forgot-link" [routerLink]="'/forgot-password'"
                    >Forgot Password ?</a
                  >
                </div>
                <button
                  class="btn btn-primary w-100 btn-lg login-btn"
                  type="submit"
                  (click)="login()"
                  [disabled]="isLoading"
                >
                  {{ isLoading ? "Logging in..." : "Login" }}
                </button>
                <div class="login-or">
                  <span class="or-line"></span>
                  <span class="span-or">or</span>
                </div>
                <div class="text-center dont-have">
                  Don’t have an account?
                  <a [routerLink]="'/register'">Register</a>
                </div>
              </form>
            </div>
          </div>
        </div>
        <!-- /Login Tab Content -->
      </div>
    </div>
  </div>
</div>
<app-home-one-footer></app-home-one-footer>
